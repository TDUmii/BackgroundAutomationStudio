name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\BackgroundAutomationStudio.sln

      - name: Build
        run: dotnet build .\BackgroundAutomationStudio.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\BackgroundAutomationStudio.sln -c Release --no-build
